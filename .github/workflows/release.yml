name: Release

# Only triggers on version tags pushed to main branch
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    # Only run if the tag points to a commit on main
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Quartermaster ${{ github.ref_name }}"
          releaseBody: |
            See the [full changelog](https://github.com/DrBaron420/Quartermaster/commits/${{ github.ref_name }}).

            ## Install
            Download `Quartermaster_*_x64-setup.exe` below and run it.
            Existing installations will be prompted to update automatically.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
